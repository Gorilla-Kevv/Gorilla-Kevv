name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug token visibility
        run: |
          RESP=$(curl -s -X POST https://api.github.com/graphql \
            -H "Authorization: bearer ${{ secrets.SNAKE_PAT }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"query{viewer{login} user(login:\"Gorilla-Kevv\"){contributionsCollection{contributionCalendar{totalContributions}}}}"}')
          echo "API response: $RESP"

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Gorilla-Kevv
          # 配 secret SNAKE_PAT（classic PAT，勾选 read:user + repo）后可包含私有仓库贡献；未配置时仅公开贡献
          github_token: ${{ secrets.SNAKE_PAT || github.token }}
          outputs: dist/github-contribution-grid-snake.svg?color_snake=40C463&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39

      - name: Commit snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🐍 update contribution snake"
          file_pattern: dist/*.svg
