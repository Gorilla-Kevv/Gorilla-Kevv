<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="avatar">
  <defs>
    <clipPath id="av"><circle cx="100" cy="100" r="86"/></clipPath>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FD8FF"/>
      <stop offset="100%" stop-color="#00A1D6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="55%" stop-color="#7FD8FF" stop-opacity="0"/>
      <stop offset="82%" stop-color="#7FD8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00A1D6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#halo)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(100,100)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle r="92" fill="none" stroke="url(#ring)" stroke-width="4"
              stroke-dasharray="120 60 30 60" stroke-linecap="round" opacity="0.95"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
      <circle r="92" fill="none" stroke="#00A1D6" stroke-width="2"
              stroke-dasharray="10 46" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <g clip-path="url(#av)">
    <image href="data:image/jpeg;base64," x="14" y="14" width="172" height="172" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
